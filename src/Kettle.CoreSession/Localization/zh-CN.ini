# UTF-8 CoreSession UI text. Values are literal single-line strings.
[strings]
WindowTitle=Kettle 游戏会话
Waiting=等待游戏启动…
Stop=停止
Preview=游戏运行中 - 原生 Win32 预览
Preparing=准备存档
Starting=正在启动
Running=运行中
Uploading=同步存档
Completed=同步完成
Stopping=正在停止
LaunchFailed=启动失败
PreparationPaused=存档准备已暂停，游戏尚未启动。
SyncPaused=存档同步已暂停，本地存档已保留。请在 Kettle 中重试。
SteamExited=SteamCMD 已退出，游戏状态未知，已阻止自动上传。请保留本地存档和运行记录。
LoginStopFailed=登录窗口已关闭，但无法停止 SteamCMD。请关闭此会话后再重试。
CancelLaunch=游戏尚未启动。是否取消本次启动并返回 Kettle？
SessionActive=游戏或存档同步仍在进行中，请保持游戏会话窗口打开。可使用“停止”结束运行中的游戏，并在 Kettle 中处理同步问题。
CloudFailure=存档同步失败。请在 Kettle 中查看详细信息，然后重试同步。
CloudConflict=检测到存档冲突。请在 Kettle 中选择要保留的存档。
PipeWrite=管道写入失败
PipeEvent=创建管道事件失败
RawPipeWrite=原始管道写入失败
WriteJournal=无法写入会话记录
FlushJournal=无法保存会话记录
CommitJournal=无法提交会话记录
OversizedField=结果字段过长。
ProcessList=无法读取进程列表，已阻止自动上传。
IncompleteProcesses=进程列表不完整，已阻止自动上传。
NotIdle=无法根据游戏进程事件确认会话空闲，已阻止同步。
RequestId=无法创建请求标识
Environment=读取环境变量失败
ProcessLaunch=进程启动失败
WatchFrontend=无法监视 Kettle 进程
MissingResult=CloudHost 已退出且未返回匹配结果，存档仍待同步。
HelperRemoval=SteamCMD 尚未确认 CloudHost 已退出，游戏启动已暂停。
ConflictTicket=缺少存档冲突凭据。
ProcessChanged=游戏进程状态在启动前发生变化。
InvalidEvent=游戏进程事件无效，无法确认游戏已结束。
NoStartEvent=未收到游戏启动事件，已阻止自动上传。
UnknownCompletion=SteamCMD 已退出，无法确认游戏是否结束。
IncompleteRequest=控制请求不完整。
WrongFrontend=Kettle 进程不匹配。
InvalidSessionDirectory=会话目录无效。
FrontendConnected=已有另一个 Kettle 进程连接。
StaleConflict=存档冲突已过期。
InvalidChoice=选择无效。
NotRunning=游戏未在运行。
NotAwaitingRetry=当前未在等待重试。
Occupied=会话正被占用。
InvalidJobDirectory=任务目录无效。
InvalidJob=任务标识无效。
InvalidLaunchOption=启动选项无效。
UnconfirmedExit=无法确认上次游戏已退出，已阻止自动启动和上传。
IncompleteRun=本次运行尚未完成。
AssistantOwned=本次运行仍由游戏会话进程管理。
UnknownCommand=未知命令。
InputPipe=创建输入管道失败
OutputPipe=创建输出管道失败
PseudoConsole=创建伪控制台失败
InitializeAttributes=初始化进程属性失败
SetPseudoConsole=设置伪控制台失败
LaunchSteam=启动 SteamCMD 失败
CreateJob=创建进程作业失败
AssignJob=分配终端进程作业失败
ConsoleHandles=打开控制台句柄失败
